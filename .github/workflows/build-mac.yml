name: Build Mac App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install system dependencies
        run: |
          brew install qt@5
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Mac app
        run: |
          pyinstaller jd-supplier-label-generator-mac.spec
      
      - name: Create DMG
        run: |
          cd dist
          VERSION=${GITHUB_REF_NAME#v}
          DMG_NAME="jd-supplier-label-generator-${VERSION}.dmg"
          
          # 创建临时目录用于 DMG 内容
          mkdir -p dmg_temp
          cp -r jd-supplier-label-generator.app dmg_temp/
          ln -s /Applications dmg_temp/Applications
          
          # 创建 DMG
          hdiutil create -volname "JD Supplier Label Generator" -srcfolder dmg_temp -ov -format UDZO "$DMG_NAME"
          
          # 清理临时目录
          rm -rf dmg_temp
          
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ env.DMG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
