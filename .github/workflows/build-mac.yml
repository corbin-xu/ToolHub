name: Build Mac App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install system dependencies
        run: |
          brew install qt@5
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Mac app
        run: |
          pyinstaller ToolHub-mac.spec
      
      - name: Create DMG
        run: |
          cd dist
          
          # 创建临时目录用于 DMG 内容
          mkdir -p dmg_temp
          cp -r ToolHub.app dmg_temp/
          ln -s /Applications dmg_temp/Applications
          
          # 创建 DMG
          hdiutil create -volname "ToolHub" -srcfolder dmg_temp -ov -format UDZO ToolHub-1.2.dmg
          
          # 清理临时目录
          rm -rf dmg_temp
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/ToolHub-1.2.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
